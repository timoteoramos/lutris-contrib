name: "Tree of Savior Classic"
game_slug: "tree-of-savior-classic"
version: "Launcher 1.3.1"
slug: "tree-of-savior-classic"
runner: "wine"

script:
  files:
  - launcher: "https://patch.tosclassic.com/launcher/Yufa-Launcher-Setup-1.3.1.exe"
  game:
    prefix: "$GAMEDIR"
    exe: "$GAMEDIR/drive_c/ProgramData/Yufa Launcher/Yufa Launcher.exe"
  installer:
  - extract:
      dst: "$GAMEDIR/drive_c/ProgramData/Yufa Launcher"
      file: "launcher"
      format: "7z"
  - task:
      arch: "win64"
      description: "Creating Wine prefix"
      name: "create_prefix"
      prefix: "$GAMEDIR"
  - task:
      name: "winetricks"
      description: "Installing MS corefonts..."
      app: "corefonts"
      silent: true
  - task:
      name: "winetricks"
      description: "Installing Visual Studio C++ 2010 Redistributable..."
      app: "vcrun2010"
      silent: true
  - task:
      name: "winetricks"
      description: "Installing Visual Studio C++ 2013 Redistributable..."
      app: "vcrun2013"
      silent: true
